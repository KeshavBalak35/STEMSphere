services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes: ["jobs:/app/data"]
    mem_limit: 2g
    cpus: 1
  worker:
    build: .
    command: ["python", "-m", "nmrx.worker"]
    environment:
      NMRX_DB: data/jobs.sqlite3
      NMRX_JOB_TIMEOUT: 1800
    volumes: ["jobs:/app/data"]
    mem_limit: 4g
    cpus: 1
volumes:
  jobs:
